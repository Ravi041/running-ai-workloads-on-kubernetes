apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  labels:
    app: ai-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-gateway
  template:
    metadata:
      labels:
        app: ai-gateway
    spec:
      containers:
        - name: gateway
          image: gcr.io/${PROJECT_ID}/ai-on-k8s:latest
          ports:
            - containerPort: 8080
          env:
            - name: MODEL_PROVIDER
              value: "ollama"
            - name: MODEL_NAME
              value: "llama2"
            - name: OLLAMA_HOST
              value: "http://ollama:11434"
            - name: VLLM_HOST
              value: "http://vllm:8080"
